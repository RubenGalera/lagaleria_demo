<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<!-- Anti-FOUT tema claro — ver comentario completo en index.html <head> -->
<script>(function(){try{var p=JSON.parse(localStorage.getItem('aj_prefs')||'{}');var t=p.theme||'dark';var light=t==='light'||(t==='system'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches);document.documentElement.classList.add(light?'light-theme':'dark-theme');}catch(e){}})();</script>
<link rel="stylesheet" href="assets/styles/tokens.css">
<link rel="stylesheet" href="assets/styles/components.css">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>Inicio</title>
<link rel="stylesheet" href="assets/styles/inicio.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>
<body>

<div id="page-resumen" style="display:flex;flex-direction:column;flex:1;overflow:hidden">
<div style="flex:1;overflow-y:auto">

  <h2 class="sr-only">Dashboard de inicio de La Galería Neotaberna</h2>

  <div class="screen">
    <div class="hdr">
      <div class="hdr-left">
        <div class="greeting">Buenas,</div>
        <div class="title" id="hdr-name">—</div>
        <div class="date" id="hdr-date">—</div>
      </div>
    </div>

    <div class="sec" style="margin-top:14px">
      <div class="week-header">
        <div class="lbl" style="margin-bottom:0">Tu semana</div>
        <div class="week-range" id="week-range">—</div>
      </div>
      <div class="card" onclick="goToTurnos()">
        <div class="week-grid" id="week-grid"></div>
      </div>
      <div class="week-legend" id="week-legend" style="display:none">
        <span><i class="ti ti-check" aria-hidden="true"></i> turno</span>
        <span>🌴 vacaciones</span>
        <span class="wl-empty">vacío sin turno</span>
      </div>
    </div>

    <div class="sec" style="margin-top:10px">
      <div class="lbl">Turnos de hoy</div>
      <div class="card" id="turnos-hoy-card" onclick="goToTurnos()"></div>
    </div>

    <div class="group-label">Reservas hoy</div>
    <div class="sec">
      <div class="card" id="reservas-card" onclick="navTo('reservas','res')"></div>
    </div>

    <div class="sec" style="margin-top:10px;display:none" id="evento-sec">
      <div class="lbl">Próximo evento</div>
      <div class="card" id="evento-card"></div>
    </div>

    <div class="group-label">Alertas</div>
    <div class="sec">
      <div class="alerts">
        <div class="alert-card" id="alert-stock" onclick="navToStockReponer()"></div>
        <div class="alert-card warn" id="alert-turnos" onclick="navTo('turnos')"></div>
        <div class="alert-card warn" id="alert-reservas" style="display:none" onclick="navTo('reservas')"></div>
      </div>
    </div>

    <div class="group-label">Contactos</div>
    <div class="sec">
      <div class="contactos">
        <div class="cont-btn" onclick="openContactosPanel()">
          <i class="ti ti-tool" aria-hidden="true"></i>
          <span class="cont-txt">Técnicos</span>
        </div>
        <div class="cont-btn" onclick="openProveedoresPanel()">
          <i class="ti ti-truck" aria-hidden="true"></i>
          <span class="cont-txt">Proveedores</span>
        </div>
      </div>
    </div>
  </div>

</div>
</div>

<!-- BADGE MODO MOCK -->
<div id="mock-badge" style="
  display:none;position:fixed;bottom:72px;right:12px;
  background:#2a3a2a;border:1px solid rgba(74,154,90,.35);
  color:#4a9a5a;font-size:10px;font-weight:700;
  padding:4px 10px;border-radius:20px;z-index:150;
  letter-spacing:.4px;pointer-events:none;
">⬡ MOCK LOCAL</div>

<!-- CONTACTOS (solo lectura) -->
<div class="overlay" id="ov-contactos" onclick="if(event.target===this)closeModal('ov-contactos')">
  <div class="modal">
    <div class="modal-hdr">
      <div><div class="modal-title">Contactos</div><div class="modal-sub">Solo lectura</div></div>
      <button class="mclose" onclick="closeModal('ov-contactos')">&#215;</button>
    </div>
    <div class="ct-list" id="contactos-list-body"></div>
  </div>
</div>

<!-- PROVEEDORES (solo lectura) -->
<div class="overlay" id="ov-proveedores" onclick="if(event.target===this)closeModal('ov-proveedores')">
  <div class="modal">
    <div class="modal-hdr">
      <div><div class="modal-title">Proveedores</div><div class="modal-sub">Solo lectura</div></div>
      <button class="mclose" onclick="closeModal('ov-proveedores')">&#215;</button>
    </div>
    <div class="ct-list" id="proveedores-list-body"></div>
  </div>
</div>

<!-- TOAST -->
<div id="_toast" style="position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#1a2f3a;border:1px solid var(--brd2);color:var(--txt);padding:9px 18px;border-radius:20px;font-size:12px;font-weight:600;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/lib/supabase-client.js"></script>
<script src="assets/lib/ui-helpers.js"></script>
<script src="assets/lib/utils.js"></script>
<script src="assets/lib/stock-status.js"></script>
<script src="assets/js/inicio.js"></script>
</body>
</html>
